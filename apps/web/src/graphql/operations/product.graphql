query ProductDetail($barcode: String!) {
  asOf
  product(barcode: $barcode) {
    barcode name brand unit
    category { code name }
    names { rawName retailer { id name slug } }
    prices {
      regularPara discountedPara effectivePara unitPricePara vat
      discountFrom discountTo listDate asOf
      format { id name retailer { id name slug } }
    }
    cheapest { effectivePara listDate asOf format { id name } }
    history(months: 1) { month regularPara discountedPara listDate asOf }
    changes(days: 1) { changedOn regularPara discountedPara listDate asOf }
  }
}
