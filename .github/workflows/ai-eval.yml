name: AI evaluation

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Model provider
        type: choice
        options: [auto, groq, gemini]
        default: auto
        required: true
      model:
        description: Model ID (blank uses the selected provider default)
        type: string
        default: ''
      groq_model:
        description: Groq fallback model in auto mode
        type: string
        default: openai/gpt-oss-20b

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Evaluate live extraction and database retrieval
        env:
          LLM_PROVIDER: ${{ inputs.provider }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ inputs.groq_model }}
          LLM_MODEL: ${{ inputs.model || (inputs.provider == 'groq' && 'openai/gpt-oss-20b' || secrets.LLM_MODEL) }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "$LLM_PROVIDER" = groq ]; then
            if [ -z "$GROQ_API_KEY" ]; then
              echo '::error::Set the GROQ_API_KEY repository secret before using groq.'
              exit 2
            fi
            export LLM_API_KEY="$GROQ_API_KEY"
          fi
          if [ "$LLM_PROVIDER" = auto ] && { [ -z "$GROQ_API_KEY" ] || [ -z "$LLM_API_KEY" ]; }; then
            echo '::error::Auto mode requires both LLM_API_KEY and GROQ_API_KEY secrets.'
            exit 2
          fi
          uv run python -m korpa_api.ai.evaluate --live --database --record live.jsonl --out results-live.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-evaluation
          path: |
            live.jsonl
            results-live.md
          if-no-files-found: warn
