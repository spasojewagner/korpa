[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "korpa"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn>=0.34,<1",
  "pydantic==2.14.4",
  "sqlalchemy[asyncio]==2.1.9",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "typer>=0.15,<1",
  "python-dotenv>=1,<2",
  "asyncpg==0.32.0",
  "strawberry-graphql[cli,fastapi]==0.341.2",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.15,<2"]

[project.scripts]
korpa = "korpa_ingest.cli:app"

[tool.setuptools.packages.find]
where = ["apps/api/src", "packages/ingest/src"]

[tool.setuptools.package-data]
korpa_api = ["data/*.json", "data/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["apps/api/src", "packages/ingest/src"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/ingest/tests"]
