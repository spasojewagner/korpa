services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: korpa
      POSTGRES_PASSWORD: korpa
      POSTGRES_DB: korpa
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korpa -d korpa"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres:
